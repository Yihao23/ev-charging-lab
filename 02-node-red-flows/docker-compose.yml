# Node-RED with a persistent data volume.
# 带持久化数据卷的 Node-RED。
#
#   docker compose up -d
#   open http://localhost:1880          <- flow editor | 流程编辑器
#   open http://localhost:1880/ui       <- dashboard (after installing node-red-dashboard)
#
# Then import flows.json via the hamburger menu -> Import.
# 然后通过右上角菜单 -> Import 导入 flows.json。
#
# The station connects to:  ws://localhost:1880/ocpp/CP_1
# 充电桩连到:               ws://localhost:1880/ocpp/CP_1
services:
  node-red:
    image: nodered/node-red:latest
    ports:
      - "1880:1880"
    volumes:
      - node-red-data:/data
      # so the file node can write where you can read it
      # 让 file 节点写到你能读到的地方
      - ./out:/tmp
    environment:
      TZ: Europe/Berlin

volumes:
  node-red-data:
