# SteVe — the veteran open-source OCPP 1.6 CSMS (Java, with a web UI).
# SteVe —— 老牌开源 OCPP 1.6 后台 (Java，带 Web 管理界面)。
#
#   docker compose up -d
#   open http://localhost:8180/steve/manager   (admin / 1234)
#   python -m cp.charge_point --csms ws://localhost:8180/steve/websocket/CentralSystemService --id CP_1
#
# Register the charge point in the web UI FIRST (Data Management -> Charge Points),
# otherwise SteVe rejects the BootNotification.
# 请先在 Web UI 里注册充电桩 (Data Management -> Charge Points)，否则 SteVe 会拒绝
# BootNotification —— 这本身就是一个值得记录的"故障诊断"练习。
services:
  steve-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: stevedb
      MYSQL_USER: steve
      MYSQL_PASSWORD: changeme
    volumes:
      - steve-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchangeme"]
      interval: 5s
      retries: 20

  steve:
    image: steve-community/steve:latest
    depends_on:
      steve-db:
        condition: service_healthy
    ports:
      - "8180:8180"   # HTTP  | Web UI + OCPP-J websocket
      - "8443:8443"   # HTTPS
    environment:
      DB_HOST: steve-db
      DB_DATABASE: stevedb
      DB_USERNAME: steve
      DB_PASSWORD: changeme

volumes:
  steve-db-data:

# NOTE / 注意:
#   The official image tag moves; if `steve-community/steve:latest` does not
#   resolve, build from source instead (it is a plain Maven project):
#   官方镜像 tag 会变动; 若 `steve-community/steve:latest` 拉不下来，就从源码构建
#   (它是一个普通的 Maven 项目):
#     git clone https://github.com/steve-community/steve && cd steve
#     docker compose up -d      # the repo ships its own compose file
